<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione Chef</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f3eb;margin:0;color:#171717}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}h1{font-family:Georgia,serif}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:80px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:10px}.gold{background:#b99a5b;color:#111}.row{border:1px solid #eee;border-radius:14px;padding:12px;margin:10px 0}.muted{color:#666;font-size:13px}</style></head><body><div class="wrap"><h1>⚙️ Gestione Chef</h1><p class="muted">Modifica i dati sul tuo iPhone. Il pulsante “Salva sul dispositivo” aggiorna immediatamente la Web App su questo iPhone. “Scarica config.json” serve per pubblicare le modifiche su GitHub.</p><div id="form"></div><button class="gold" onclick="save()">💾 Salva sul dispositivo</button><button onclick="downloadConfig()">⬇️ Scarica config.json aggiornato</button><button onclick="location.href='index.html'">← Torna alla Web App</button></div>
<script>
let cfg={};async function init(){cfg=await (await fetch('config.json')).json();draw()}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function draw(){document.getElementById('form').innerHTML=`<div class="card"><h2>Dati principali</h2><label>Telefono WhatsApp</label><input id="phone" value="${esc(cfg.phone)}"><label>Sottotitolo</label><input id="subtitle" value="${esc(cfg.subtitle)}"><label>Claim</label><input id="tagline" value="${esc(cfg.tagline)}"><label>Titolo principale</label><input id="heroTitle" value="${esc(cfg.heroTitle)}"><label>Descrizione</label><textarea id="heroText">${esc(cfg.heroText)}</textarea></div>
<div class="card"><h2>Menu note</h2><textarea id="menuNote">${esc(cfg.menuNote)}</textarea><label>Menu su misura</label><textarea id="customMenu">${esc(cfg.customMenu)}</textarea></div>
<div class="card"><h2>Servizi</h2>${cfg.services.map((x,i)=>`<div class="row"><label>Servizio ${i+1}</label><input id="s${i}a" value="${esc(x[0])}"><textarea id="s${i}b">${esc(x[1])}</textarea></div>`).join('')}</div>
<div class="card"><h2>Esperienze e prezzi</h2>${cfg.experiences.map((x,i)=>`<div class="row"><label>Nome</label><input id="e${i}a" value="${esc(x[0])}"><label>Prezzo a persona</label><input id="e${i}b" type="number" value="${x[1]}"><label>Descrizione</label><textarea id="e${i}c">${esc(x[2])}</textarea><label>Incluso (uno per riga)</label><textarea id="e${i}d">${x[3].map(esc).join('\n')}</textarea></div>`).join('')}</div>`}
function saveFromForm(){cfg.phone=document.getElementById('phone').value;cfg.subtitle=document.getElementById('subtitle').value;cfg.tagline=document.getElementById('tagline').value;cfg.heroTitle=document.getElementById('heroTitle').value;cfg.heroText=document.getElementById('heroText').value;cfg.menuNote=document.getElementById('menuNote').value;cfg.customMenu=document.getElementById('customMenu').value;cfg.services=cfg.services.map((x,i)=>[document.getElementById('s'+i+'a').value,document.getElementById('s'+i+'b').value]);cfg.experiences=cfg.experiences.map((x,i)=>[document.getElementById('e'+i+'a').value,Number(document.getElementById('e'+i+'b').value),document.getElementById('e'+i+'c').value,document.getElementById('e'+i+'d').value.split('\n').filter(Boolean)]);return cfg}
function save(){saveFromForm();localStorage.setItem('apc_config',JSON.stringify(cfg));alert('Salvato su questo iPhone. Ora apri la Web App.')}
function downloadConfig(){saveFromForm();const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='config.json';a.click();URL.revokeObjectURL(a.href)}
init();
</script></body></html>
